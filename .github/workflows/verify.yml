name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Run all design checks (ERC, DRC, parity, firmware pin map, stack fit)
        run: python3 tools/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: docs/verification-report.md
