<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 114" font-family="system-ui,Segoe UI,Arial,sans-serif">
<text x="10" y="20" font-size="15" font-weight="700" fill="currentColor">Service cable (JST-SH 6 pin, wired 1:1)</text>
<text x="10" y="55.0" font-size="12" fill="currentColor">pin 1 - 6</text>
<rect x="72" y="36" width="60" height="30" rx="5" fill="#777"/>
<text x="102.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">VBUS</text>
<rect x="136" y="36" width="60" height="30" rx="5" fill="#777"/>
<text x="166.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">D-</text>
<rect x="200" y="36" width="60" height="30" rx="5" fill="#777"/>
<text x="230.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">D+</text>
<rect x="264" y="36" width="60" height="30" rx="5" fill="#2b2b2b"/>
<text x="294.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">G</text>
<rect x="328" y="36" width="60" height="30" rx="5" fill="#777"/>
<text x="358.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">BUZ</text>
<rect x="392" y="36" width="60" height="30" rx="5" fill="#777"/>
<text x="422.0" y="55.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#fff">BOOT</text>
<text x="10" y="104" font-size="11.5" fill="currentColor" opacity="0.75">Same order on the flight controller (J5) and on the service board (J2).</text>
</svg>